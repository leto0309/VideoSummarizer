<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><title>開啟 VideoSummarizer</title>
<style>body{font:20px system-ui;max-width:650px;margin:70px auto;padding:24px;line-height:1.7}a{display:inline-block;padding:14px 22px;background:#1767c0;color:white;border-radius:10px;text-decoration:none}code{font-size:18px}</style>
<h1>開啟 VideoSummarizer</h1>
<p>首次使用請先執行專案內 install-bookmark.bat。</p>
<a href="videosummarizer://open">檢查服務並開啟影片摘要</a>
<p>將 <code>videosummarizer://open</code> 儲存為 Chrome 書籤。</p>
<p>服務未啟動時會在背景啟動；初始化可能需要約兩分鐘。Chrome 若詢問開啟外部應用，請確認此連結是 VideoSummarizer。</p>
<p>如果 Chrome 不接受直接協議書籤，可以收藏此頁，再點上方按鈕。</p>
</html>
