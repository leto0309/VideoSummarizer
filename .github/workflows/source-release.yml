name: Source release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PYTHONIOENCODING: utf-8
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install and test release source
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=30)
          assert not app.exception, [item.message for item in app.exception]
          '@ | python -
      - name: Build source ZIP and SHA256
        run: python scripts/build_source.py $env:RELEASE_TAG
      - name: Attach download files to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload $env:RELEASE_TAG "dist/VideoSummarizer-$env:RELEASE_TAG-source.zip" dist/SHA256SUMS.txt
